[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Once pytest-cov is installed, run:
;   pytest --cov=src --cov-report=term-missing --cov-report=html tests/
; (not set as a default addopts here, so plain `pytest tests/` still works
; even without pytest-cov installed)
